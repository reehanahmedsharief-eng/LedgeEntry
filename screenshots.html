<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LedgeEntry — Screenshots</title>
<meta name="description" content="Browse LedgeEntry app screenshots." />
<meta name="theme-color" content="#E4E9F2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1E2430" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="assets/logo.png" />
<link rel="apple-touch-icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#E4E9F2;--text:#2B3245;--sub:#6B7280;--accent:#6C7CE0;--accentText:#FFFFFF;--gold:#B4884D;--shadowD:#B7BECB;--card:#FFFFFF;--border:#DCE2EC}
  [data-theme="dark"]{--bg:#1E2430;--text:#ECEFF7;--sub:#8D9AB0;--accent:#8B98F0;--accentText:#12141C;--gold:#D9B679;--shadowD:#14181F;--card:#262D3A;--border:#333B4A}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden}
  h1,h2,h3{font-family:'Sora',sans-serif;margin:0 0 12px}
  a{color:var(--accent);text-decoration:none}
  img{max-width:100%;height:auto;display:block}
  button{font:inherit}
  .container{max-width:1180px;margin:0 auto;padding:0 20px}
  @media (min-width:768px){.container{padding:0 24px}}

  header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:12px;min-height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;font-family:'Sora';white-space:nowrap}
  .brand img{width:32px;height:32px;border-radius:10px}
  .topnav{display:none;gap:18px;align-items:center}
  @media (min-width:768px){.topnav{display:flex}}
  .topnav a{position:relative;padding:6px 2px;transition:color .2s;color:var(--text);font-weight:500;font-size:14px}
  .topnav a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s;border-radius:2px}
  .topnav a:hover{color:var(--accent)}
  .topnav a:hover::after{width:100%}
  .header-actions{display:flex;gap:8px;align-items:center}
  .btn.header-download{display:none}
  @media (min-width:480px){.btn.header-download{display:inline-flex}}
  .theme-toggle{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:14px;min-height:40px;min-width:40px}
  .menu-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:18px;min-height:40px;min-width:40px;display:flex;align-items:center;justify-content:center}
  @media (min-width:768px){.menu-btn{display:none}}
  .mobile-menu{display:none;flex-direction:column;gap:6px;padding:8px 0 16px;border-top:1px solid var(--border)}
  .mobile-menu.open{display:flex}
  .mobile-menu a{padding:12px 4px;color:var(--text);font-weight:500;font-size:15px;border-radius:8px}
  .mobile-menu a:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;border:none;cursor:pointer;font-weight:600;font-size:14px;transition:transform .2s,box-shadow .2s,background .2s;position:relative;overflow:hidden;min-height:44px}
  .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s;pointer-events:none}
  .btn:hover::after{transform:translateX(100%)}
  .btn:hover{transform:translateY(-2px) scale(1.02)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--gold)));color:var(--accentText);border:2px solid color-mix(in srgb,#7EA6FF 60%,#FFFFFF);box-shadow:0 0 0 4px color-mix(in srgb,#7EA6FF 25%,transparent),0 10px 28px color-mix(in srgb,var(--accent) 40%,transparent);animation:pulseBorder 2s ease-in-out infinite}
  @keyframes pulseBorder{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,#7EA6FF 20%,transparent),0 10px 28px color-mix(in srgb,var(--accent) 40%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,#7EA6FF 35%,transparent),0 14px 34px color-mix(in srgb,var(--accent) 50%,transparent)}}
  .btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}

  .hero{padding:48px 0 16px;text-align:center}
  @media (min-width:768px){.hero{padding:60px 0 20px}}
  .hero h1{font-size:clamp(28px,6vw,52px);line-height:1.1}
  .hero h1 span{color:var(--accent)}
  .hero p{max-width:640px;margin:12px auto 20px;color:var(--sub);font-size:16px}

  .wrap{max-width:420px;margin:0 auto;text-align:center;padding:0 16px}
  .phone{background:#0A0E16;border-radius:32px;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.35);width:100%;max-width:320px;margin:0 auto}
  @media (min-width:480px){.phone{border-radius:40px;padding:12px}}
  .phone img{width:100%;border-radius:24px;display:block}
  @media (min-width:480px){.phone img{border-radius:28px}}
  .cap{margin-top:14px;color:var(--sub);font-size:14px;min-height:20px}
  .arrows{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  .arrows .btn{flex:1;max-width:140px}

  /* thumbnails */
  .thumbs{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--border);cursor:pointer;opacity:.6;transition:opacity .2s,border-color .2s,transform .2s}
  .thumb:hover{opacity:.9;transform:scale(1.05)}
  .thumb.active{opacity:1;border-color:var(--accent)}
  .thumb img{width:100%;height:100%;object-fit:cover}

  footer{padding:32px 0;border-top:1px solid var(--border);color:var(--sub);font-size:14px;text-align:center;margin-top:32px}
  #bgCanvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
</style>
</head>
<body data-theme="light">
<canvas id="bgCanvas"></canvas>
<header>
  <div class="container">
    <div class="nav">
      <div class="brand"><img src="assets/logo.png" alt="" /> LedgeEntry</div>
      <nav class="topnav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="index.html#download">Download</a>
      </nav>
      <div class="header-actions">
        <a class="btn primary header-download" href="LedgeEntry-debug.apk" download style="padding:8px 14px;font-size:13px">Download APK</a>
        <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">🌙</button>
        <button class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">☰</button>
      </div>
    </div>
    <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile">
      <a href="index.html">Home</a>
      <a href="index.html#download">Download</a>
      <a href="screenshots.html">Screenshots</a>
    </nav>
  </div>
</header>
<main class="container">
  <section class="hero">
    <h1>App <span>Screenshots</span></h1>
    <p>Browse the LedgeEntry interface. Use the arrows or thumbnails to move between screens.</p>
  </section>
  <div class="wrap">
    <div class="phone">
      <img id="shotImg" src="assets/shot-home.png" alt="App screenshot" loading="lazy" />
    </div>
    <p class="cap" id="shotCaption">Home — net worth, cash, quick access</p>
    <div class="arrows">
      <button id="prevShot" class="btn ghost">‹ Prev</button>
      <button id="nextShot" class="btn ghost">Next ›</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div style="margin-top:24px">
      <a class="btn primary" href="LedgeEntry-debug.apk" download>⬇ Download APK</a>
    </div>
  </div>
</main>
<footer>
  <div class="container">
    <div>LedgeEntry · Made by REEHAN AHMED SHARIFF . S</div>
  </div>
</footer>

<script>
  const shots = [
    { src: 'assets/shot-loginpage.png', caption: 'Login — secure access to your ledger' },
    { src: 'assets/shot-home.png', caption: 'Home — net worth, cash, quick access' },
    { src: 'assets/shot-statements.png', caption: 'Statements — income, expense, network & assets' },
    { src: 'assets/shot-ai.png', caption: 'AI Assistant — built-in & Gemini' },
    { src: 'assets/shot-profile.png', caption: 'Profile — account & tools' },
    { src: 'assets/shot-settings.png', caption: 'Settings — preferences & about' },
  ];
  let i = 0;
  const img = document.getElementById('shotImg');
  const cap = document.getElementById('shotCaption');
  const thumbsEl = document.getElementById('thumbs');
  shots.forEach((s, idx) => {
    const t = document.createElement('div');
    t.className = 'thumb' + (idx===0?' active':'');
    t.innerHTML = '<img src="'+s.src+'" alt="" loading="lazy" />';
    t.addEventListener('click', () => show(idx));
    thumbsEl.appendChild(t);
  });
  function show(n){ i=(n+shots.length)%shots.length; img.src=shots[i].src; cap.textContent=shots[i].caption; thumbsEl.querySelectorAll('.thumb').forEach((t,idx)=>t.classList.toggle('active',idx===i)); }
  document.getElementById('prevShot').addEventListener('click',()=>show(i-1));
  document.getElementById('nextShot').addEventListener('click',()=>show(i+1));
  // swipe support
  let startX=0;
  const phone = document.querySelector('.phone');
  phone.addEventListener('touchstart',(e)=>{startX=e.touches[0].clientX;},{passive:true});
  phone.addEventListener('touchend',(e)=>{const dx=e.changedTouches[0].clientX-startX; if(Math.abs(dx)>40){ dx<0?show(i+1):show(i-1);}},{passive:true});
  show(0);

  // mobile menu
  const menuBtn = document.getElementById('menuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  menuBtn.addEventListener('click', () => {
    const open = mobileMenu.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.textContent = open ? '✕' : '☰';
  });
  mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    mobileMenu.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); menuBtn.textContent='☰';
  }));

  // theme
  const btn = document.getElementById('themeBtn');
  const apply = (t) => { document.body.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'; localStorage.setItem('le-theme', t); };
  const saved = localStorage.getItem('le-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  apply(saved);
  btn.addEventListener('click', () => apply(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  // canvas
  (function(){
    const c=document.getElementById('bgCanvas');const ctx=c.getContext('2d');let w,h,pts=[],mouse={x:-9999,y:-9999};
    const N=window.innerWidth<640?24:50;
    function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
    function init(){pts=[];for(let k=0;k<N;k++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});}
    function step(){ctx.clearRect(0,0,w,h);const dark=document.body.getAttribute('data-theme')==='dark';const col=dark?'139,152,240':'108,124,224';for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);if(d<180&&d>0){p.vx+=dx/d*.015;p.vy+=dy/d*.015;}const sp=Math.hypot(p.vx,p.vy);if(sp>.5){p.vx*=.5/sp;p.vy*=.5/sp;}}for(let a=0;a<pts.length;a++)for(let b=a+1;b<pts.length;b++){const dx=pts[a].x-pts[b].x,dy=pts[a].y-pts[b].y,d=Math.hypot(dx,dy);if(d<130){ctx.strokeStyle='rgba('+col+','+(1-d/130)*.35+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke();}}for(const p of pts){ctx.fillStyle='rgba('+col+',.8)';ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();}requestAnimationFrame(step);}
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches && window.innerWidth>=640){resize();init();step();window.addEventListener('resize',()=>{resize();init();});window.addEventListener('mousemove',(e)=>{mouse.x=e.clientX;mouse.y=e.clientY;});window.addEventListener('mouseleave',()=>{mouse.x=-9999;mouse.y=-9999;});}
  })();
</script>
</body>
</html>
